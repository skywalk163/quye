name: Build & Deploy Pages

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site
        run: python 建站.py

      - name: Deploy to GitCode Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 出/
