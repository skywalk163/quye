name: Build & Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 每日 UTC 22:00（北京 06:00）自动构建，捕获上游漂移
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 硬门禁 1：构建必须过。任何异常 → 整个 job 红 → deploy 跳过 → 旧站保留。
      - name: Build site
        run: python 建站.py

      # 硬门禁 2：产物自检（关键路由 + 站内死链 + 学习区页数）
      - name: Verify artifacts
        run: python 工具/产物自检.py

      # 软门禁：命中率实测（依赖极快 retrieval 模块可用）。
      # 门禁阈值 80%（M4 上调）。红牌不阻塞部署，只在 job summary 告警。
      - name: Retrieval hit-rate (soft gate)
        id: hitrate
        continue-on-error: true
        run: python 工具/命中率实测.py

      - name: Warn on hit-rate regression
        if: steps.hitrate.outcome == 'failure'
        run: |
          echo "::warning::命中率低于阈值 80%，请检查极快块库或 retrieval 抽取路径"

      # 软门禁：块示例自检（/块 页对每块都提供「在浏览器里跑」，这里验证示例真能跑）。
      # 阈值 90%——文件/网络类块在浏览器沙箱里跑不通属预期，低于该线说明布局或上游出了系统性问题。
      - name: Block examples (soft gate)
        id: blockdemo
        continue-on-error: true
        run: python 工具/块示例自检.py

      - name: Warn on block example regression
        if: steps.blockdemo.outcome == 'failure'
        run: |
          echo "::warning::块示例通过率低于 90%，/块 页的「在浏览器里跑」可能大面积失效——优先查 stdlib 路径补丁"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 出/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
